     <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <header>
        <h1>My Library</h1>
    </header>
    <main>
        <div>
            <section class="book-collection">
                <h2 class="section-title">Book Collection</h2>
                <p class="section-description">A growing catalog of books i've read this year!</p>
                <ul class="book-list">
                    <li class="book-item">
                        <figure>
                            <img src="Assets/acotar.webp" alt="A Court of Thorns and Roses book cover">
                        <figcaption class="book-info">
                            <h3>A Court of Thorns and Roses</h3>
                            <p>A human huntress is drawn into a dangerous faerie world.</p>
                        </figcaption>
                    </figure>
                </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/acomaf.webp" alt="A Court of Mist and Fury book cover">
                            <figcaption class="book-info">
                                <h3>A Court of Mist and Fury</h3>
                                <p>Feyre faces the aftermath of the events at the Spring Court.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/acowar.webp" alt="A Court of War and Ruin book cover">
                            <figcaption class="book-info">
                                <h3>A Court of Wings and Ruin</h3>
                                <p>Feyre works to protect her court as war approaches.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/acofas.webp" alt="A Court of Frost and Starlight book cover">
                            <figcaption class="book-info">
                                <h3>A Court of Frost and Starlight</h3>
                                <p>The characters begin to rebuild after a devastating war.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/acosf.webp" alt="A Court of Silver Flames book cover">
                            <figcaption class="book-info">
                                <h3>A Court of Silver Flames</h3>
                                <p>Nesta confronts her past while training to become a warrior.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/thehobbit.webp" alt="The Hobbit book cover">
                            <figcaption class="book-info">
                                <h3>The Hobbit</h3>
                                <p>Bilbo Baggins joins a band of dwarves on a quest for treasure.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/thelordoftherings.webp" alt="The Lord of the Rings book cover">
                            <figcaption class="book-info">
                                <h3>The Lord of the Rings</h3>
                                <p>A small fellowship sets out to destroy a powerful ring.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/themidnightlibrary.webp" alt="The Midnight Library book cover">
                            <figcaption class="book-info">
                                <h3>The Midnight Library</h3>
                                <p>A woman explores the lives she might have lived.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/thebookthief.webp" alt="The Book Thief book cover">
                            <figcaption class="book-info">
                                <h3>The Book Thief</h3>
                                <p>A young girl finds comfort in books during wartime Germany.</p>
                            </figcaption>
                        </figure>
                    </li>
                    <li class="book-item">
                        <figure>
                            <img src="Assets/howlsmovingcastle.webp" alt="Howl's Moving Castle book cover">
                            <figcaption class="book-info">
                                <h3>Howl's Moving Castle</h3>
                                <p>Sophie is swept into the strange and magical world of wizard Howl.</p>
                            </figcaption>
                        </figure>
                    </li>
                </ul>
            </section>
        </div>
    </main>
