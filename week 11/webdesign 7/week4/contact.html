<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device=width, initial-scale=1.0">
    <title>Contact US</title>
</head>

<body>
    <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="a107e51f-cf98-42bc-9942-6f2397f3cc5e">

        <!-- ADD YOUR INPUTS -->
        <fieldset>
            <legend>Contact Information</legend>

            <label for="name">Name:</label>
            <input type="name" id="name" name="name" placeholder="Your full name..." required>

            <br>
            <label for="email">Email:</label>
            <input type="email" autocomplete="email" name="email" id="email" placeholder="Enter your email..." required>

            <br>
            <label for="phone">Phone number:</label>
            <input type="tel" name="phone" id="phone" placeholder="Enter your phone..." maxlength="10">
        </fieldset>

        <br>
        <label for="service">Select a Service</label>
        <select name="service" id="service">
            <option value="">—SELECT ONE—</option>
            <option value="art">Art Direction</option>
            <option value="brand">Brand Film</option>
            <option value="colour">Colour Finish</option>
        </select>

        <br>
        <fieldset>
            <legend>Budget range</legend>
            <input type="radio" name="budget" id="budget-1">
            <label for="budget-1">Under $5k</label>
            <input type="radio" name="budget" id="budget-2">
            <label for="budget-2">$5k</label>
            <input type="radio" name="budget" id="budget-3">
            <label for="budget-3">$15k+</label>
        </fieldset>

        <fieldset>
            <legend>Which extras do you need?</legend>
            <input type="checkbox" name="extras" id="extra-editing">
            <label for="extra-editing">Photo Editing</label>
            <input type="checkbox" name="extras" id="extra-smm">
            <label for="extra-smm">Social media management</label>
            <input type="checkbox" name="extras" id="extra-prints">
            <label for="extra-prints">Printed Photographs</label>
        </fieldset>

        <label for="date">Ideal shoot date</label>
        <input type="date" id="date" name="date">

        <br>
        <label for="message">Message</label>
        <textarea name="message" id="message" rows="4" placeholder="Enter your message...">
        </textarea>

        <br>
        <label for="upload">Upload your photo:</label><br>
        <input type="file" name="upload" id="upload">

        <label for="pass">Enter your password:</label>
        <input type="password" name="pass" id="pass">

        <br>
        <button type="submit">Send</button>
    </form>

    <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSfqKeBiYMstbFakDB9hddFBNT1ldIEgk29NRsElli7v_7OsgA/viewform?embedded=true"
        width="640" height="961" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
</body>

</html>
